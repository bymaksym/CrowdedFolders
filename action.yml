name: crowded-folders
description: Finds the folders that have become a junk drawer — too many files, or modules sharing a prefix that are a folder nobody made.
author: bymaksym
branding:
  icon: folder
  color: orange

inputs:
  version:
    description: The crowded-folders version to run. By default, the one this Action was released with, so pinning the Action (by tag or SHA) pins the tool. An npm version to run another; "local" runs this checkout's build.
    default: ''
  args:
    description: Anything the command takes, e.g. "--max-warnings 0" or "src packages/web".
    default: ''
  summary:
    description: Also add the Markdown report to the job summary.
    default: 'true'
  sarif:
    description: Also write a SARIF report and upload it to code scanning (needs `security-events - write` permission).
    default: 'false'
  sarif-file:
    description: Where the SARIF report is written, relative to the working directory.
    default: crowded-folders.sarif
  category:
    description: The code scanning category of the SARIF upload; tell runs on different folders apart with it.
    default: crowded-folders
  fail-on:
    description: 'When the step fails - "error" (errors, stale suppressions), "warning" (also any warning) or "none" (only when the configuration or the command line is wrong).'
    default: error
  working-directory:
    description: Where to run it (the configuration is looked for from here).
    default: '.'
  comment:
    description: 'On a pull request, also keep one comment on it up to date with what is new, what grew and what improved against its base (needs `pull-requests - write` permission, and the base fetched - fetch-depth 0). Edited in place on every push, never posted twice.'
    default: 'false'
  token:
    description: The token the comment is written with.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: The exit code of crowded-folders - 0 clean, 1 problems, 2 the configuration or the command line is wrong.
    value: ${{ steps.check.outputs.exit-code }}
  errors:
    description: How many errors it reported.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: How many warnings it reported.
    value: ${{ steps.check.outputs.warnings }}
  sarif-file:
    description: The SARIF report, relative to the working directory, when `sarif` is true.
    value: ${{ steps.check.outputs.sarif-file }}

# Why composite and not `node24`. A JavaScript action runs a bundle committed to the tag, and the
# bundle has to be produced by a build step this repository does not have (no dependency, no
# bundler); a bundle that is not rebuilt exactly at each release would silently run old code.
# Composite runs the published package instead, which release-please already versions with the
# tag. Its costs are the runner's `node` and `npx` (both present on every GitHub-hosted runner)
# and that pinning by SHA pins the Action's own steps, not the npm code: the version it runs is
# the one in package.json at that SHA, fetched by exact number.
runs:
  using: composite
  steps:
    # The version is decided once: the Action's own unless one is given.
    - name: Resolve the version
      id: resolve
      shell: bash
      run: |
        if [ -z "$VERSION" ]; then VERSION=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version"); fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ inputs.version }}
    # One run writes every report: annotations on the log, the job summary, the SARIF and the JSON
    # whose counts become outputs.
    - name: Check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "$VERSION" = "local" ]; then cmd=(node "$GITHUB_ACTION_PATH/bin/crowded-folders.js"); else cmd=(npx --yes "crowded-folders@$VERSION"); fi
        json="$RUNNER_TEMP/crowded-folders-report.json"
        rm -f "$json"
        reports=(-f github -f "json=$json")
        if [ "$SUMMARY" = "true" ]; then reports+=(-f "markdown=$GITHUB_STEP_SUMMARY"); fi
        if [ "$SARIF" = "true" ]; then reports+=(-f "sarif=$SARIF_FILE"); echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"; fi
        comment="$RUNNER_TEMP/crowded-folders-comment.md"
        rm -f "$comment"
        if [ "$COMMENT" = "true" ]; then reports+=(-f "markdown=$comment"); fi
        extra=()
        if [ "$FAIL_ON" = "warning" ]; then
          case " $ARGS " in *" --max-warnings"*) ;; *) extra+=(--max-warnings 0) ;; esac
        fi
        set +e
        # shellcheck disable=SC2086 # ARGS is a list of arguments on purpose
        "${cmd[@]}" "${reports[@]}" "${extra[@]}" $ARGS
        code=$?
        set -e
        errors=0; warnings=0
        if [ -f "$json" ]; then
          read -r errors warnings < <(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary;console.log(s.errors+' '+s.warnings)" "$json")
        fi
        {
          echo "exit-code=$code"
          echo "errors=$errors"
          echo "warnings=$warnings"
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        ARGS: ${{ inputs.args }}
        SUMMARY: ${{ inputs.summary }}
        SARIF: ${{ inputs.sarif }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        COMMENT: ${{ inputs.comment }}
    - name: Upload the SARIF report
      if: always() && inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        category: ${{ inputs.category }}
    # One comment per pull request, found by the marker its body starts with and edited in place:
    # a comment per push buries the conversation. Through gh, which every GitHub-hosted runner has,
    # so the Action stays a composite with nothing to install. A token that cannot write (a pull
    # request from a fork) is a warning, not a failure: the check itself already ran.
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      run: |
        comment="$RUNNER_TEMP/crowded-folders-comment.md"
        if [ ! -f "$comment" ]; then echo "::notice::crowded-folders wrote no report to comment with."; exit 0; fi
        pr=$(node -p "String(require(process.env.GITHUB_EVENT_PATH).pull_request?.number ?? '')")
        if [ -z "$pr" ]; then exit 0; fi
        marker='<!-- crowded-folders: pull request comment -->'
        body="$RUNNER_TEMP/crowded-folders-comment-body.md"
        # GitHub takes 65 536 characters in a comment.
        node -e "const fs=require('fs');const n=String.fromCharCode(10);let t=fs.readFileSync(process.argv[1],'utf8');if(t.length>65000)t=t.slice(0,65000)+n+n+'_… cut at 65 000 characters: the job summary has it all._'+n;fs.writeFileSync(process.argv[2],process.argv[3]+n+t)" "$comment" "$body" "$marker"
        id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1) || id=""
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null || echo "::warning::crowded-folders could not edit its comment (does the job have pull-requests: write?)"
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F "body=@$body" > /dev/null || echo "::warning::crowded-folders could not comment (does the job have pull-requests: write?)"
        fi
      env:
        GH_TOKEN: ${{ inputs.token }}
    # The step above never fails by itself, so that the upload always runs; this one decides.
    - name: Pass or fail
      shell: bash
      run: |
        code="$CODE"
        if [ "$code" = "2" ]; then exit 2; fi
        if [ "$code" = "1" ] && [ "$FAIL_ON" != "none" ]; then exit 1; fi
        exit 0
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
