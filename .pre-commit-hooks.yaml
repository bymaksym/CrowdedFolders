# For https://pre-commit.com: `repo: https://github.com/bymaksym/CrowdedFolders`, `rev:` a release tag.
# The hook runs the published package at the version of that tag (release-please updates it below).
# pre-commit also installs this repository from git, unbuilt (npm runs no build scripts for a git
# dependency), and `npx crowded-folders@x` would pick that copy because name and version match: the
# alias makes npx fetch the package from the registry instead.
# Offline or behind a registry mirror (Nexus, Artifactory): --prefer-offline uses npm's cache once it has
# the package, but the first run needs the registry. Building the package in `prepare` would not remove
# that need (pre-commit packs this repository without its devDependencies, so there is no compiler), so
# for a machine that must work without network, install crowded-folders as a devDependency and use a
# `repo: local` hook with `language: system` and `entry: crowded-folders` (docs/ci.md shows it).
# The check reads the whole tree, not the files of a commit, so it runs on push.
- id: crowded-folders
  name: crowded-folders
  description: Finds the folders that have become a junk drawer.
  entry: npx --yes --prefer-offline --package=crowded-folders-release@npm:crowded-folders@1.0.0 -- crowded-folders # x-release-please-version
  language: node
  pass_filenames: false
  always_run: true
  stages: [pre-push]
